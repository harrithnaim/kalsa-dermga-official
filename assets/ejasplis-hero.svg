<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="ejT ejD">
<title id="ejT">eJasPlis — peer-to-peer crowd-shipping</title>
<desc id="ejD">A sender and a recipient connected along a travel route by someone already going that way, carrying a parcel, with a phone showing a match.</desc>
<style>
.h{font:600 40px Georgia,'Source Serif 4',serif;fill:#fff}
.s{font:400 17px system-ui,sans-serif;fill:#9dc9ce}
.k{font:600 11px system-ui,sans-serif;fill:#1cadab;letter-spacing:.16em}
.lb{font:600 12px system-ui,sans-serif;fill:#fff;letter-spacing:.04em}
.t{font:600 13px system-ui,sans-serif;fill:#0a2540}
.tm{font:400 11px system-ui,sans-serif;fill:#7b8b98}
.pin{font:600 15px system-ui,sans-serif;fill:#0a2540;letter-spacing:.18em}
</style>
<rect width="800" height="600" fill="#0a2540"/>
<circle cx="650" cy="90" r="200" fill="#0d2e4e"/>
<text x="56" y="86" class="k">eJASPLIS</text>
<text x="56" y="140" class="h">Send it with</text>
<text x="56" y="188" class="h">someone going there.</text>
<text x="56" y="224" class="s">Community crowd-shipping. A matchmaker, not a courier.</text>

<!-- route -->
<g transform="translate(0 300)">
  <path d="M70 120 C 220 40, 380 40, 470 90" fill="none" stroke="#1cadab" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- sender pin -->
  <g transform="translate(70 120)">
    <path d="M0 0 C -22 -30 -22 -54 0 -54 C 22 -54 22 -30 0 0 Z" fill="#0e9aa3"/>
    <circle cx="0" cy="-34" r="9" fill="#fff"/>
    <text x="0" y="26" class="lb" text-anchor="middle" fill="#9dc9ce">SENDER</text>
  </g>
  <!-- traveller carrying parcel -->
  <g transform="translate(268 44)">
    <circle cx="0" cy="-24" r="18" fill="#f4c9a3"/>
    <path d="M-18 -26a18 18 0 0 1 36 0z" fill="#2f2118"/>
    <path d="M-18 -4h36l7 44h-50z" fill="#1cadab"/>
    <rect x="20" y="6" width="26" height="24" rx="3" fill="#edbb00"/>
    <path d="M20 18h26M33 6v24" stroke="#c99f00" stroke-width="2"/>
    <text x="0" y="66" class="lb" text-anchor="middle" fill="#fff">TRAVELLER</text>
  </g>
  <!-- recipient pin -->
  <g transform="translate(470 90)">
    <path d="M0 0 C -22 -30 -22 -54 0 -54 C 22 -54 22 -30 0 0 Z" fill="#edbb00"/>
    <circle cx="0" cy="-34" r="9" fill="#0a2540"/>
    <text x="0" y="26" class="lb" text-anchor="middle" fill="#9dc9ce">RECIPIENT</text>
  </g>
</g>

<!-- phone: match + PIN -->
<g transform="translate(520 250)">
  <rect x="-6" y="-6" width="242" height="330" rx="26" fill="#08203a"/>
  <rect width="230" height="318" rx="22" fill="#fff"/>
  <rect x="83" y="12" width="64" height="7" rx="3.5" fill="#dfe6ea"/>
  <text x="20" y="52" class="k">MATCH FOUND</text>
  <g transform="translate(20 70)">
    <circle cx="18" cy="18" r="17" fill="#e6f7f7"/>
    <path d="M11 18l5 5 9-11" stroke="#0e9aa3" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="46" y="14" class="t">Kuantan → Kuala Lumpur</text>
    <text x="46" y="31" class="tm">Parcel · 2 kg · tomorrow</text>
  </g>
  <rect x="20" y="120" width="190" height="1" fill="#e8eef1"/>
  <g transform="translate(20 138)">
    <circle cx="18" cy="16" r="15" fill="#0a2540"/><circle cx="18" cy="12" r="5" fill="#fff"/><path d="M9 26c0-6 4-9 9-9s9 3 9 9z" fill="#fff"/>
    <text x="46" y="13" class="t">Aiman — traveller</text>
    <text x="46" y="30" class="tm">4.9 ★ · 23 trips</text>
  </g>
  <rect x="20" y="188" width="190" height="52" rx="8" fill="#f2f7f8"/>
  <text x="34" y="210" class="tm">Handover PIN</text>
  <text x="34" y="230" class="pin">4 7 2 9</text>
  <rect x="20" y="252" width="190" height="40" rx="6" fill="#1cadab"/>
  <text x="115" y="277" class="lb" text-anchor="middle">CONFIRM PICKUP</text>
</g>
</svg>
