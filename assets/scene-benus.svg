<title id="t">Roadside plot in Benus</title>
<desc id="d">A cartoon of a fruit seller waving from a stall on the Benus roadside plot as a car drives past, with a For Rent sign.</desc>
<style>
.wave{animation:wave 1.6s ease-in-out infinite}
