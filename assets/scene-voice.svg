<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Order by voice on ORDERje</title>
<desc id="d">A cartoon of a customer at a table saying their order in Malay; the ORDERje menu on the phone fills in milo ais, roti canai and teh tarik, ready to check and pay.</desc>
<style>
.wave{animation:wave 1.6s ease-in-out infinite}
.wave2{animation:wave 1.9s .3s ease-in-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite}
.bob2{animation:bob 3.6s .8s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.blink{animation:blink 5s infinite}
.sway{animation:sway 4.5s ease-in-out infinite}
.drift{animation:drift 18s linear infinite}
.flow{animation:flow 6s linear infinite}
.flicker{animation:flicker .45s ease-in-out infinite alternate}
.pop{animation:pop 5s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-240px)}}
@keyframes flicker{from{transform:scaleY(.9) scaleX(1.05)}to{transform:scaleY(1.1) scaleX(.95)}}
@keyframes pop{0%,8%{opacity:0;transform:translateY(14px) scale(.96)}16%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
